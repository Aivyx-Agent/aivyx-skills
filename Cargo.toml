[workspace]

[package]
name = "aivyx-skills"
description = "Default, system-level SKILL.md-format skill library shared by Aivyx PA and aivyx-coder"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"
publish = false

[dependencies]
rust-embed = { version = "8.12.0", features = ["debug-embed"] }

[dev-dependencies]
tempfile = "3"

# Unix-only, test-only: used to create a FIFO (`libc::mkfifo`) in
# loader.rs's bounded-read regression tests. Never affects downstream
# consumers (aivyx-pa, aivyx-coder) since dev-dependencies aren't part of
# this crate's dependency graph when used as a library.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
